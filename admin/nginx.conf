# 猪猪生活本 · 后台管理静态站点 + 反向代理到 nest-service。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 静态资源默认强缓存 30 天
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /api/* 反代到 nest-service 容器
    # docker-compose 中 admin 服务与 api 服务在同一网络，可直接用服务名 api:3000
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 20m;   # 允许上传较大的菜品/食品图片
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 关闭 nginx 版本泄漏
    server_tokens off;
}
