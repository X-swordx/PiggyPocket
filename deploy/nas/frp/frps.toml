# FRP 服务端配置
# 部署在有公网 IP 的云服务器上

bindPort = 7000

# 鉴权方式，生产环境必须设置
auth.method = "token"
auth.token = "请修改为你的强Token"

# 可选：Web 管理面板
# 建议通过 SSH 隧道访问，不要直接暴露到公网
webServer.addr = "127.0.0.1"
webServer.port = 7500
webServer.user = "admin"
webServer.password = "请修改为你的强密码"

# 可选：限制允许连接的 IP（如果有固定 NAS 出口 IP）
# allowPorts = [
#   { start = 6000, end = 7000 }
# ]
