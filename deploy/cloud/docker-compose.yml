name: ${COMPOSE_PROJECT_NAME:-piggy-pocket}

services:
  mysql:
    image: mysql:8.0
    container_name: ${CONTAINER_PREFIX:-piggy}_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${DATA_DIR}/mysql:/var/lib/mysql
      - ${BACKUP_DIR}/mysql:/backup
    networks:
      - piggy-network
    ports:
      - "127.0.0.1:${MYSQL_BIND_PORT:-3306}:3306"
    command: --default-authentication-plugin=mysql_native_password
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ../../nest-service
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX:-piggy}_api
    restart: always
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_LOGGING: ${DB_LOGGING:-false}
      WECHAT_APPID: ${WECHAT_APPID}
      WECHAT_SECRET: ${WECHAT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_JWT_EXPIRES_IN: ${ADMIN_JWT_EXPIRES_IN}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_REGION: ${OSS_REGION}
      OSS_BUCKET: ${OSS_BUCKET}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      MODEL_NAME: ${MODEL_NAME}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      VISION_MODEL_NAME: ${VISION_MODEL_NAME}
      WECHAT_EXPIRY_TEMPLATE_ID: ${WECHAT_EXPIRY_TEMPLATE_ID}
      WECHAT_POOP_TEMPLATE_ID: ${WECHAT_POOP_TEMPLATE_ID}
      MILVUS_ADDRESS: ${MILVUS_ADDRESS}
      MILVUS_TOKEN: ${MILVUS_TOKEN}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
    networks:
      - piggy-network
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  admin:
    build:
      context: ../../admin
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX:-piggy}_admin
    restart: always
    networks:
      - piggy-network
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: ${CONTAINER_PREFIX:-piggy}_npm
    restart: unless-stopped
    ports:
      - "${NPM_HTTP_PORT:-80}:80"
      - "${NPM_ADMIN_PORT:-81}:81"
      - "${NPM_HTTPS_PORT:-443}:443"
    volumes:
      - ${DATA_DIR}/npm-data:/data
      - ${DATA_DIR}/npm-letsencrypt:/etc/letsencrypt
    networks:
      - piggy-network
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  piggy-network:
    driver: bridge
