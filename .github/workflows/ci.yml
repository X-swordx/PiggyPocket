name: ci

on:
  pull_request:
    branches: [main, develop, stage, production]
  push:
    branches: [develop, stage]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nest-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nest-service/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand

  admin:
    name: admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - run: corepack enable
      - run: corepack prepare pnpm@11.13.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fantastic-admin/core-element-plus build

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan working tree
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect --source /repo --no-git --redact --config /repo/.gitleaks.toml -v
